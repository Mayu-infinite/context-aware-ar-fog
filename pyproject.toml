[project]
name = "context-aware-ar-fog"
version = "0.1.0"
description = "Context-aware visual and auditory cueing system for Freezing of Gait research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "torch>=2.4",
    "transformers>=5.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

# CPU build of PyTorch (only the phone-camera depth model uses it). For an NVIDIA GPU,
# point this index at https://download.pytorch.org/whl/cu130 and run `uv sync`.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
