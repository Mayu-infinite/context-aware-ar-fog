[project]
name = "context-aware-ar-fog"
version = "0.1.0"
description = "Context-aware visual and auditory cueing system for Freezing of Gait research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "transformers>=5.20.1",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
